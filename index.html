
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Pronadi knjigu</title>
<style>
body { background-color: #ccffcc; font-family: Arial, sans-serif; }
h1 { font-family: 'Comic Sans MS', cursive; text-align:center; }
button { display:block; margin:10px auto; padding:10px 20px; font-size:16px; }
#quiz-container { width: 80%; margin: 0 auto; text-align:center; }
.book-display img { max-width:200px; display:block; margin:10px auto; }
</style>
</head>
<body>
<h1>Pronadi knjigu</h1>
<div id="quiz-container">
<button id="start-btn">Započni</button>
<div id="question-container" style="display:none;"></div>
<div id="result-container" style="display:none;"></div>
</div>
<script>
let books = [];
fetch('books.json')
  .then(res => res.json())
  .then(data => books = data);

let startBtn = document.getElementById('start-btn');
let questionContainer = document.getElementById('question-container');
let resultContainer = document.getElementById('result-container');
let selectedAge = null;
let selectedGenre = null;
let selectedDifficulty = null;
let selectedLength = null;

startBtn.addEventListener('click', () => {
  startBtn.style.display = 'none';
  showAgeQuestion();
});

function showAgeQuestion() {
  questionContainer.style.display = 'block';
  questionContainer.innerHTML = '<h2>Koliko imate godina?</h2>';
  let ages = ['10-15','15-18','18-25','25-35','35+'];
  ages.forEach(age => {
    let btn = document.createElement('button');
    btn.innerText = age;
    btn.onclick = () => { selectedAge = age; showGenreQuestion(); };
    questionContainer.appendChild(btn);
  });
}

function showGenreQuestion() {
  questionContainer.innerHTML = '<h2>Koji žanr želite čitati?</h2>';
  let genres = ['Fantasy','Mystery','Romance','History','Sci-Fi','Psychology','Thriller','Non-fiction'];
  genres.forEach(g => {
    let btn = document.createElement('button');
    btn.innerText = g;
    btn.onclick = () => { selectedGenre = g.toLowerCase(); showDifficultyQuestion(); };
    questionContainer.appendChild(btn);
  });
}

function showDifficultyQuestion() {
  questionContainer.innerHTML = '<h2>Težina knjige?</h2>';
  let difficulties = ['easy','medium','hard'];
  difficulties.forEach(d => {
    let btn = document.createElement('button');
    btn.innerText = d;
    btn.onclick = () => { selectedDifficulty = d; showLengthQuestion(); };
    questionContainer.appendChild(btn);
  });
}

function showLengthQuestion() {
  questionContainer.innerHTML = '<h2>Duljina knjige?</h2>';
  let lengths = ['short','medium','long'];
  lengths.forEach(l => {
    let btn = document.createElement('button');
    btn.innerText = l;
    btn.onclick = () => { selectedLength = l; showResult(); };
    questionContainer.appendChild(btn);
  });
}

function showResult() {
  questionContainer.style.display = 'none';
  let filtered = books.filter(b => 
    b.genre===selectedGenre && 
    b.difficulty===selectedDifficulty &&
    b.length===selectedLength &&
    ageMatch(b)
  );
  let book = filtered[Math.floor(Math.random()*filtered.length)];
  resultContainer.style.display = 'block';
  resultContainer.innerHTML = `<h2>${book.title}</h2>
  <p>Autor: ${book.author}</p>
  <img src='${book.cover}'>
  <p>Ocjena: ${book.rating}</p>
  <a href='${book.link}' target='_blank'>Saznaj više</a>
  <br><button onclick='showResult()'>Preporuči drugu knjigu</button>`;
}

function ageMatch(book) {
  let min = parseInt(book.minAge); let max = parseInt(book.maxAge);
  let age = parseInt(selectedAge.split('-')[0]);
  if(selectedAge==='35+') age = 35;
  return age>=min && age<=max;
}
</script>
</body>
</html>
